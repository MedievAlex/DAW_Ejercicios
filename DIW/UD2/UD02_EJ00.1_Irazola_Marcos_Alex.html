<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Ejercicio 01. Botón</title>

    <style>
        /* ----------------------------------EJERCICIO 02---------------------------------- */
        /*
        Crear un botón a partir de un link.
        */

        .boton {
            background-color: blueviolet;
            color: yellow;

            border-radius: 20%;
            padding: 10px 20px;
            border: 2px solid blueviolet;

            text-decoration: none;

            cursor: pointer;
        }

        .boton:hover {
            background-color: dimgray;
        }

        .boton:active {
            background-color: red;
        }
    </style>

</head>

<body>
    <header>
        <h3>Ejercicio 02. Botón</h3>
        <p>
            Crear un botón a partir de un link.
        </p>
    </header>
    <hr>
    <br>
    <a class="boton" href="https://www.tartanga.eus/">PULSAR</a>
</body>

</html>
