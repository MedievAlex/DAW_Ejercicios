<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Ejercicio 03. DNI</title>

    <style>
        /* ----------------------------------EJERCICIO 03---------------------------------- */
        /*
        Crear un DNI sin utilizar posicionamiento.
        */

        table {
            border-collapse: collapse;
            
            background-color: aqua;
        }

        .left {
            background-color: yellow;
        }

        .title {
            font-size: 10px;
        }
    </style>

</head>

<body>
    <header>
        <h3>Ejercicio 03. DNI</h3>
        <p>
            Crear un DNI sin utilizar posicionamiento.
        </p>
    </header>

    <table>
        <tr> <!-- Fila 1 -->
            <td rowspan="4" class="left">
                <h2>ESPAÑA</h2>
            </td> <!-- Filas 1, 2, 3, 4 -->
            <td colspan="3">
                <h3>DOCUMENTO NACIONAL DE IDENTIDAD</h3>
            </td> <!-- Columna 2, 3, 4 -->
        </tr>
        <tr> <!-- Fila 2 -->
            <td colspan="2">
                <a class="title">PRIMER APELLIDO</a>
                <br>
                <b>ESPAÑOL</b>
            </td> <!-- Columna 2, 3 -->
            <td rowspan="3">

            </td> <!-- Filas 2, 3, 4 -->
        </tr>
        <tr> <!-- Fila 3 -->
            <td colspan="2">
                <a class="title">SEGUNDO APELLIDO</a>
                <br>
                <b>ESPAÑOL</b>
            </td> <!-- Columna 2, 3 -->
        </tr>
        <tr> <!-- Fila 4 -->
            <td colspan="2">
                <a class="title">NOMBRE</a>
                <br>
                <b>JUAN</b>
            </td> <!-- Columna 2, 3 -->
        </tr>
        <tr> <!-- Fila 5 -->
            <td rowspan="3" class="left">
                <img src="Recursos/chip-de-DNI.png" alt="Chip del DNI" width="100" height="100">
            </td> <!-- Filas 5, 6, 7 -->
            <td>
                <a class="title">SEXO</a>
                <br>
                <b>M</b>
            </td>
            <td>
                <a class="title">NACIONALIDAD</a>
                <br>
                <b>ESP</b>
            </td>
            <td rowspan="5">
                <img src="Recursos/fotos-de-DNI.jpg" alt="Foto del DNI">
            </td> <!-- Filas 5, 6, 7, 8, 9 -->
        </tr>
        <tr> <!-- Fila 6 -->
            <td colspan="2">
                <a class="title">FECHA DE NACIMIENTO</a>
                <br>
                <b>10 01 1950</b>
            </td> <!-- Columna 2, 3 -->
        </tr>
        <tr> <!-- Fila 7 -->
            <td colspan="2">
                <a class="title">IDESP</a>
                <br>
                <b>AAA023112</b>
            </td> <!-- Columna 2, 3 -->
        </tr>
        <tr> <!-- Fila 8 -->
            <td rowspan="2" class="left">
                <a class="title">DNI NUM</a>
                <br>
                <b>65004204V</b>
            </td> <!-- Filas 8, 9 -->
            <td colspan="2">
                <a class="title">VALIDO HASTA</a>
                <br>
                <b>17 04 2018</b>
            </td> <!-- Columna 2, 3 -->
        </tr>
        <tr> <!-- Fila 9 -->
            <td colspan="2">
                <img src="Recursos/firma-de-DNI.png" alt="Firma del DNI" width="100" height="100">
            </td> <!-- Columna 2, 3 -->
        </tr>
    </table>

</html>
